---
# manifests/overprovisioning/surge-overprovisioner-karpenter.yaml
#
# Karpenter variant of surge-overprovisioner.yaml for ROSA HCP AutoNode clusters.
#
# nodeAffinity pins the balloon pods to the Karpenter NodePool (autonode-bench),
# preventing them from scheduling on default HCP workers where they would not
# contribute to Karpenter-managed capacity.
#
# Two Karpenter-specific design rules vs the CAS variant:
#
#   1. podAntiAffinity (one pod per node, required): forces Karpenter to
#      provision one distinct headroom node per replica. Without this,
#      Karpenter's bin-packing can land all replicas on a single node
#      (5 × 500m = 2.5 CPU — easily fits on one m5.xlarge), reducing
#      effective headroom from 5 nodes to 1. After eviction the consolidation
#      loop would see room on existing nodes, pack the pending balloons
#      together, and never restore the headroom nodes.
#
#   2. No karpenter.sh/do-not-disrupt annotation: we WANT Karpenter to allow
#      preemption so real workloads can land instantly. The resulting Pending
#      state signals Karpenter to re-provision the headroom node.
#
# Applied by: run-test-11-planned-surge.py (balloon-pods strategy, hcp-autonode)
#             run-test-12-sudden-spike.py  (Phase 2, hcp-autonode)
apiVersion: v1
kind: Namespace
metadata:
  name: benchmark
  labels:
    benchmark: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surge-overprovisioner
  namespace: benchmark
  labels:
    app: surge-overprovisioner
    benchmark: "true"
  annotations:
    description: >
      Karpenter-pinned balloon pods for surge scenarios. Reserves capacity
      in the Karpenter NodePool so balloon pods are preempted by cpu-burner
      when a surge arrives, enabling instant scheduling without CAS/Karpenter wait.
spec:
  replicas: 5
  selector:
    matchLabels:
      app: surge-overprovisioner
  template:
    metadata:
      labels:
        app: surge-overprovisioner
        benchmark: "true"
    spec:
      priorityClassName: cluster-overprovisioner
      terminationGracePeriodSeconds: 0
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: surge-overprovisioner
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
                      - autonode-bench
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
