---
# manifests/overprovisioning/pause-deployment-karpenter.yaml
#
# Mirror of pause-deployment.yaml for ROSA HCP AutoNode (Karpenter) clusters.
#
# Same pause image, resource requests, and PriorityClass so the headroom
# reservation and preemption behaviour is identical to the Classic run.
#
# Two Karpenter-specific design rules vs the CAS variant:
#
#   1. podAntiAffinity (one pod per node, required): forces Karpenter to
#      provision one distinct headroom node per replica. Without this,
#      Karpenter's bin-packing can land all replicas on a single node,
#      reducing effective headroom, and its consolidation loop can later
#      eliminate spare nodes by packing the balloons together.
#
#   2. No karpenter.sh/do-not-disrupt annotation: we WANT Karpenter to
#      allow these pods to be preempted/evicted when real workloads arrive.
#      The resulting Pending state is what triggers Karpenter to re-provision
#      the headroom node.
#
# Applied by: run-test-09b-karpenter-overprovisioning.py
# Requires: priority-class.yaml to be applied first
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-overprovisioner
  namespace: benchmark
  labels:
    app: cluster-overprovisioner
    benchmark: "true"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: cluster-overprovisioner
  template:
    metadata:
      labels:
        app: cluster-overprovisioner
        benchmark: "true"
    spec:
      priorityClassName: cluster-overprovisioner
      terminationGracePeriodSeconds: 0
      tolerations:
        - operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cluster-overprovisioner
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
                      - autonode-bench
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
