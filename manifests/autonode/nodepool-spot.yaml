---
# manifests/autonode/nodepool-spot.yaml
#
# Karpenter NodePool for Test 15 (spot instance support benchmark).
#
# Uses EC2 Spot instances (karpenter.sh/capacity-type: spot).
# Allows m5.xlarge and r5.xlarge so Karpenter can fall back to r5.xlarge if
# m5.xlarge spot capacity is unavailable in the AZ — this is intentional and
# mirrors real-world spot usage.
#
# Pods land on this pool via nodeAffinity:
#   karpenter.sh/nodepool=autonode-spot
#
# Requires: AutoNode enabled on the cluster (rosa edit cluster --autonode=enabled)
#           and ec2nodeclass/default READY=True.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: autonode-spot
spec:
  template:
    metadata:
      labels:
        autonode-spot: "true"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.xlarge
            - r5.xlarge
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "40"
    memory: 160Gi
  disruption:
    # Consolidate quickly so scale-down observation completes in reasonable time.
    # Spot nodes may also be interrupted by AWS — this policy allows Karpenter to
    # replace interrupted nodes automatically.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
