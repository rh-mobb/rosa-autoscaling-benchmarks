---
# manifests/autonode/nodepool.yaml
#
# Karpenter NodePool for AutoNode benchmark tests (test 10).
#
# All nodes provisioned by this pool carry the label autonode=true so that
# benchmark workloads can pin to them via nodeSelector without landing on the
# cluster's default machine-pool workers.
#
# Requires: AutoNode enabled on the cluster (rosa edit cluster --autonode=enabled)
#           and ec2nodeclass/default READY=True.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: autonode-bench
spec:
  template:
    metadata:
      labels:
        autonode: "true"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.xlarge
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  # Allow up to 20 nodes and 200 vCPUs in this pool during benchmarks
  limits:
    cpu: "80"
    memory: 320Gi
  disruption:
    # Consolidate quickly so scale-down tests complete in minutes, not hours
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
