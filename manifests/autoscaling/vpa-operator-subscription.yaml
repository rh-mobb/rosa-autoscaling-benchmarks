---
# manifests/autoscaling/vpa-operator-subscription.yaml
#
# OLM objects to install the Vertical Pod Autoscaler (VPA) operator from
# OperatorHub on an OpenShift / ROSA cluster.
#
# Apply order matters: OperatorGroup before Subscription.
# The operator installs into the openshift-vertical-pod-autoscaler namespace.
#
# After applying, wait for the operator to be ready:
#   oc wait -n openshift-vertical-pod-autoscaler \
#     deployment/vertical-pod-autoscaler-operator \
#     --for=condition=Available --timeout=5m
#
# Required by:
#   - benchmark-hpa (test 06) — VPA runs alongside HPA in Off mode
#   - benchmark-vpa-advise (test 07) — reads VPA recommendations
#
# On ROSA you may instead install via:
#   rosa install add-on --cluster <name> vertical-pod-autoscaler
# if the add-on is available in your ROSA version. Use this manifest as
# a fallback when the add-on is not listed.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-vertical-pod-autoscaler
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: vertical-pod-autoscaler
  namespace: openshift-vertical-pod-autoscaler
spec:
  targetNamespaces:
    - openshift-vertical-pod-autoscaler
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: vertical-pod-autoscaler
  namespace: openshift-vertical-pod-autoscaler
spec:
  channel: stable
  installPlanApproval: Automatic
  name: vertical-pod-autoscaler
  source: redhat-operators
  sourceNamespace: openshift-marketplace
