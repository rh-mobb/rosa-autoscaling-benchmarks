---
# Karpenter NodePool for the OTel Demo load-test workloads.
# Applied automatically by deploy.sh install when Karpenter CRDs are detected.
# Nodes carry label workload=otel-demo and taint workload=otel-demo:NoSchedule so
# only otel-demo pods (which have the matching toleration) schedule here.
# k6 Job pods intentionally omit the toleration and run on default worker nodes.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: otel-demo
spec:
  template:
    metadata:
      labels:
        workload: otel-demo
    spec:
      # Taint keeps non-otel-demo pods off these nodes
      taints:
        - key: workload
          value: otel-demo
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [m5, m6i, m6a]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge, 2xlarge]
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
