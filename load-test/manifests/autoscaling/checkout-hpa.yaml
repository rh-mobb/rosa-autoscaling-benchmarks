---
# HPA for the OTel demo checkout service — correctly configured baseline.
# Uses CPU at 60% which gives HPA room to fire before saturation.
# maxReplicas 10 is well above expected peak load.
#
# Advisor should produce: no finding (or info-level confirmation)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-hpa
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: otel-demo
    load-test/config: correct
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
