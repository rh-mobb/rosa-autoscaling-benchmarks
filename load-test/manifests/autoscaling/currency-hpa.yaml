---
# HPA for the OTel demo currency service — correctly configured.
# Lightweight Go service with conservative threshold.
#
# Advisor should produce: no finding
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: currency-hpa
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: otel-demo
    load-test/config: correct
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: currency
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
