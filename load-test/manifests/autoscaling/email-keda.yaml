---
# KEDA ScaledObject for the OTel demo email service.
# Scales based on the length of the 'email-jobs' list in Valkey (Redis).
# This is the queue-based scaler demo — correctly configured baseline.
#
# The email service processes checkout confirmation emails.
# Checkout enqueues a job to 'email-jobs' after each successful order.
#
# Advisor should produce: no finding (correctly configured queue scaler)
#
# Requires: KEDA operator installed on the cluster
#   oc apply -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: email-scaledobject
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: otel-demo
    load-test/config: correct
spec:
  scaleTargetRef:
    name: otel-demo-email
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: redis
      metadata:
        address: otel-demo-valkey-cart:6379
        listName: email-jobs
        listLength: "10"
        # activationListLength: scale from 0 when list has at least 1 item
        activationListLength: "1"
