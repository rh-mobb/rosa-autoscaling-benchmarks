name: Bug report
description: Scripts, Makefile, docs, or harness behavior is incorrect
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, cluster type (classic / hcp / hcp-autonode), and relevant env if safe to share (no secrets).
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: false

