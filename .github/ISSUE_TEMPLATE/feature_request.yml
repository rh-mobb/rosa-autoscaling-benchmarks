name: Feature request
description: Propose an enhancement or new benchmark scenario
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Optional sketch of Makefile / script / skill changes.
    validations:
      required: false

