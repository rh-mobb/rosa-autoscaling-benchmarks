# Publish simulator + Slidev deck to GitHub Pages (project site root).
# Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reports/classic-vs-hcp_autonode/package-lock.json

      - name: Install deck dependencies
        working-directory: reports/classic-vs-hcp_autonode
        run: npm ci

      - name: Build Slidev deck (subpath base for Pages)
        working-directory: reports/classic-vs-hcp_autonode
        env:
          SLIDEV_BASE: /${{ github.event.repository.name }}/deck/
        run: npm run build -- --base "${SLIDEV_BASE}"

      - name: Assemble site
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p _site/simulator _site/deck
          cp simulator/index.html _site/simulator/
          cp -r reports/classic-vs-hcp_autonode/dist/. _site/deck/
          sed "s#__GITHUB_REPO_URL__#https://github.com/${REPOSITORY}#g" pages/index.html > _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
